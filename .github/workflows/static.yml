
name: Deploy FarmCare to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "FarmCare-LandingPage/**"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload FarmCare files
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./FarmCare-LandingPage

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

