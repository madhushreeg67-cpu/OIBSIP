
name: Deploy All OIBSIP Projects to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "FarmCare-LandingPage/**"
      - "Personal-Portfolio/**"
      - "WebDev-L1-TemperatureConverter/**"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare all projects
        run: |
          mkdir -p _site/Personal-Portfolio
          mkdir -p _site/WebDev-L1-TemperatureConverter

          cp -R FarmCare-LandingPage/. _site/
          cp -R Personal-Portfolio/. _site/Personal-Portfolio/
          cp -R WebDev-L1-TemperatureConverter/. _site/WebDev-L1-TemperatureConverter/

      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
